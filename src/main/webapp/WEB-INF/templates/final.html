<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #28a745;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .stats p {
            margin: 10px 0;
            font-size: 1.2em;
        }
        .mensaje-motivacional {
            font-size: 1.1em;
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
        }
        a {
            display: inline-block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
        }
        a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="finish-container">
    <h1>ENHORABUENA!!!</h1>

    <div class="mensaje-enhorabuena">
        <p th:text="${mensajeGanaste}">El número era</p>
        <p>Vamooo!!!</p>
    </div>

    <div class="stats">
        <p><strong>Usuario:</strong> <span th:text="${usuario}"></span></p>
        <p><strong>Intentos utilizados:</strong> <span th:text="${intentos}"></span></p>
        <div class="mensaje-motivacional">
            <p th:text="${mensaje}"></p>
        </div>
    </div>

    <a th:href="@{/juego}">Volver a jugar</a>
</div>
</body>
</html>
